services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://srs:srs@pgbouncer:5432/srs
      # Two worker threads let two bulk-AI files process concurrently while
      # still keeping GIL contention low. Override per host via .env if needed.
      JOB_WORKER_THREADS: "2"
      # 500 MiB hard cap on a single bulk-AI upload (matches the upload
      # endpoint default). Lower this on memory-tight hosts.
      MAX_BULK_UPLOAD_MB: "500"
      # Connection pool. The SQLAlchemy defaults (5 + 10) were too tight once the
      # worker, the SSE streams and every request share the same pool.
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "20"
      DB_POOL_TIMEOUT: "30"
      DB_POOL_RECYCLE: "1800"
      # Nothing may hold a connection forever - a runaway statement is what turns
      # one bad job into "every write stalls". 0 disables the cap.
      DB_STATEMENT_TIMEOUT_MS: "300000"
    # A big chapter costs several times its own size while it is being parsed and
    # generated, so cap the container and let it restart instead of taking the
    # host down with it.
    mem_limit: 1536m
    restart: unless-stopped
    depends_on:
      - pgbouncer
      - seaweedfs
    ports:
      - "18000:8000"
    volumes:
      - media_data:/app/app/static/media

  seaweedfs:
    container_name: edu_viz-seaweedfs-1
    image: chrislusf/seaweedfs:3.90
    command: "server -dir=/data -ip=seaweedfs -master.port=9333 -volume.port=8080 -filer=true -filer.port=8888 -s3 -s3.port=8333 -master.volumeSizeLimitMB=256"
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: srs
      DB_PASSWORD: srs
      DB_NAME: srs
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: srs
      POSTGRES_USER: srs
      POSTGRES_PASSWORD: srs
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  media_data:
  seaweedfs_data:
